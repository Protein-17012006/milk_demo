# Saves money: stops development, test and staging every night at 23:00 Vietnam time
# (scales their services to 0 tasks). The next deployment starts a stopped service by
# itself; this workflow can also start or stop them by hand. Production is never stopped here.
name: Power

on:
  schedule:
    - cron: "0 16 * * *" # 16:00 UTC = 23:00 in Ho Chi Minh City
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [stop, start]
        default: stop
      environment:
        type: choice
        options: [all-nonprod, development, test, staging]
        default: all-nonprod

permissions:
  contents: read

jobs:
  power:
    name: ${{ inputs.action || 'stop' }} ${{ inputs.environment || 'all-nonprod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: power
      cancel-in-progress: false
    env:
      AWS_REGION: ap-southeast-1
      ACTION: ${{ inputs.action || 'stop' }}
      TARGET: ${{ inputs.environment || 'all-nonprod' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Scale services
        run: |
          source scripts/ci/lib.sh
          envs=("$TARGET")
          [ "$TARGET" != all-nonprod ] || envs=(development test staging)
          count=0
          [ "$ACTION" != start ] || count=1
          for env in "${envs[@]}"; do
            cluster=$(env_cluster "$env")
            if [ "$(service_tag "$cluster" "milk-$env")" = "-" ]; then
              log "$env is not deployed; skipping"
              continue
            fi
            aws ecs update-service --cluster "$cluster" --service "milk-$env" --desired-count "$count" >/dev/null
            log "$env: desired count $count"
            echo "- $env: $ACTION" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$count" = 1 ]; then
            for env in "${envs[@]}"; do
              aws ecs wait services-stable --cluster "$(env_cluster "$env")" --services "milk-$env" 2>/dev/null || true
            done
          fi
