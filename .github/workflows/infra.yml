# The shared platform stack (infra/platform.yml): VPC, load balancer, ECR, clusters, alerts.
#   pull request touching it  -> change-set preview in the job summary (never executed)
#   merge to main touching it -> deploy, after a reviewer approves the "platform" environment
#   manual run                -> deploy (first-time setup), also after approval
# The per-environment stacks (infra/app.yml) are deployed by cd.yml on every release.
name: Infrastructure

on:
  pull_request:
    branches: [main]
    paths: [infra/platform.yml]
  push:
    branches: [main]
    paths: [infra/platform.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  STACK: milk-platform

jobs:
  preview:
    name: change-set preview
    # Pull requests from forks get no secrets, so they cannot preview; nor can any PR before
    # scripts/ci/setup_github.sh has run (it sets the AWS_ACCOUNT_ID variable with the secrets).
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Preview
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: scripts/ci/preview_changeset.sh "$STACK" infra/platform.yml "AlertEmail=$ALERT_EMAIL"

  deploy:
    name: deploy platform
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: platform
    concurrency:
      group: infra-platform
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Deploy milk-platform
        env:
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
        run: |
          source scripts/ci/lib.sh
          [ -n "$ALERT_EMAIL" ] || warn "repo variable ALERT_EMAIL is empty: alarms go to SNS without an email subscription"
          # An account that has never used ECS has no ECS service-linked role, and CreateCluster
          # fails without it ("Unable to assume the service linked role"). Create it once.
          if out=$(aws iam create-service-linked-role --aws-service-name ecs.amazonaws.com 2>&1); then
            log "created the ECS service-linked role"
            sleep 15 # IAM is eventually consistent
          elif [[ "$out" == *"has been taken"* ]]; then
            log "ECS service-linked role exists"
          else
            fail "could not create the ECS service-linked role: $out"
          fi
          # A failed first create leaves the stack in ROLLBACK_COMPLETE, which cannot be updated.
          status=$(stack_status "$STACK")
          if [ "$status" = ROLLBACK_COMPLETE ]; then
            log "$STACK is left over from a failed first deployment; deleting it"
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          elif [[ "$status" == *_IN_PROGRESS ]]; then
            fail "$STACK is busy ($status); run the workflow again when it has finished"
          fi
          if ! aws cloudformation deploy --stack-name "$STACK" --template-file infra/platform.yml \
            --no-fail-on-empty-changeset --tags project=milk \
            --parameter-overrides "AlertEmail=$ALERT_EMAIL"; then
            stack_failures "$STACK"
            fail "CloudFormation could not update $STACK"
          fi
          {
            echo "### milk-platform"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query 'Stacks[0].Outputs[].[OutputKey, OutputValue]' --output text |
              while read -r key value; do echo "| $key | \`$value\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$ALERT_EMAIL" ] || echo "If this is the first deployment, confirm the SNS subscription email sent to the alert address." >> "$GITHUB_STEP_SUMMARY"
