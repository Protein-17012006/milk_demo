AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Milk shelf demo, storage: S3 bucket for releases, models, blurred frames and results,
  and a DynamoDB table of captures. Kept apart from the server so the server can be
  rebuilt without touching data.

Parameters:
  Project:
    Type: String
    Default: milk-demo
  RetentionDays:
    Type: Number
    Default: 7
    Description: >-
      Days to keep stored frames and results. 7 since 2026-11-22: continuous captures are kept 7 days;
      the official hourly captures live 90 days in the website backend (decision of 2026-11-21).
  IngestQueueArn:
    Type: String
    Default: ""
    Description: >-
      SQS queue of the website backend (milk-backend-<env> output IngestQueueArn). When set, every new
      results/*.json is announced to it (HOANG-P10 decision 3). Its queue policy must allow this bucket first.

Conditions:
  SendResultsToBackend: !Not [!Equals [!Ref IngestQueueArn, ""]]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      NotificationConfiguration: !If
        - SendResultsToBackend
        - QueueConfigurations:
            - Event: "s3:ObjectCreated:*"
              Queue: !Ref IngestQueueArn
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: results/
                    - Name: suffix
                      Value: .json
        - !Ref AWS::NoValue
      LifecycleConfiguration:
        Rules:
          - Id: expire-frames
            Status: Enabled
            Prefix: frames/
            ExpirationInDays: !Ref RetentionDays
          - Id: expire-results
            Status: Enabled
            Prefix: results/
            ExpirationInDays: !Ref RetentionDays
          - Id: expire-old-releases
            Status: Enabled
            Prefix: releases/2
            ExpirationInDays: 30
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: project
          Value: !Ref Project

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyPlainHttp
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  CapturesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: camera_id
          AttributeType: S
        - AttributeName: capture_id
          AttributeType: S
      KeySchema:
        - AttributeName: camera_id
          KeyType: HASH
        - AttributeName: capture_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: project
          Value: !Ref Project

Outputs:
  BucketName:
    Value: !Ref DataBucket
  TableName:
    Value: !Ref CapturesTable
